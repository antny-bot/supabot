<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>supabot - 지능형 퀀트 트레이딩 및 자산 관리 플랫폼</title>
    <meta name="description" content="암호화폐 및 주식 퀀트 자동매매와 포트폴리오 관리를 위한 스마트 솔루션 supabot" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo-120.png" />
    <meta property="og:title" content="supabot manager" />
    <meta property="og:description" content="스마트 퀀트 트레이딩 및 자산 관리 플랫폼" />
    <meta property="og:image" content="/logo.png" />
    <script>
      (function () {
        const stored = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || ((!stored || stored === 'system') && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
